additionalLabels: {}
affinity: {}
alternateConfig: {}
annotations: {}
apiVersion: apps/v1
autoscaling:
  additionalMetrics: []
  behavior: {}
  enabled: false
  maxReplicas: 10
  minReplicas: 1
  targetCPUUtilizationPercentage: 80
clusterRole:
  annotations: {}
  clusterRoleBinding:
    annotations: {}
    name: ""
  create: false
  name: ""
  rules: []
command:
  extraArgs: []
  name: ""
config:
  exporters:
    debug: {}
    otlp/jaeger:
      endpoint: jaeger.monitoring.svc.cluster.local:4317
      tls:
        insecure: true
  extensions:
    health_check:
      endpoint: ${env:MY_POD_IP}:13133
  processors:
    batch: {}
    memory_limiter:
      check_interval: 5s
      limit_percentage: 80
      spike_limit_percentage: 25
  receivers:
    jaeger:
      protocols:
        grpc:
          endpoint: ${env:MY_POD_IP}:14250
        thrift_compact:
          endpoint: ${env:MY_POD_IP}:6831
        thrift_http:
          endpoint: ${env:MY_POD_IP}:14268
    otlp:
      protocols:
        grpc:
          endpoint: ${env:MY_POD_IP}:4317
        http:
          endpoint: ${env:MY_POD_IP}:4318
    prometheus:
      config:
        scrape_configs:
          - job_name: opentelemetry-collector
            scrape_interval: 10s
            static_configs:
              - targets:
                  - ${env:MY_POD_IP}:8888
    zipkin:
      endpoint: ${env:MY_POD_IP}:9411
  service:
    extensions:
      - health_check
    pipelines:
      logs:
        exporters:
          - debug
        processors:
          - memory_limiter
          - batch
        receivers:
          - otlp
      metrics:
        exporters:
          - debug
        processors:
          - memory_limiter
          - batch
        receivers:
          - otlp
          - prometheus
      traces:
        exporters:
          - debug
          - otlp/jaeger
        processors:
          - memory_limiter
          - batch
        receivers:
          - otlp
          - jaeger
          - zipkin
    telemetry:
      metrics:
        readers:
          - pull:
              exporter:
                prometheus:
                  host: ${env:MY_POD_IP}
                  port: 8888
      resource:
        host.name: ${env:OTEL_K8S_NODE_NAME}
        k8s.namespace.name: ${env:OTEL_K8S_NAMESPACE}
        k8s.node.ip: ${env:OTEL_K8S_NODE_IP}
        k8s.node.name: ${env:OTEL_K8S_NODE_NAME}
        k8s.pod.ip: ${env:OTEL_K8S_POD_IP}
        k8s.pod.name: ${env:OTEL_K8S_POD_NAME}
configMap:
  create: true
  existingName: ""
dnsConfig: {}
dnsPolicy: ""
enableConfigChecksumAnnotation: true
extraContainers: []
extraEnvs: []
extraEnvsFrom: []
extraManifests: []
extraVolumeMounts: []
extraVolumes: []
fullnameOverride: ""
hostAliases: []
hostNetwork: false
hostPID: false
image:
  digest: ""
  pullPolicy: IfNotPresent
  repository: otel/opentelemetry-collector-k8s
  tag: ""
imagePullSecrets: []
ingress:
  additionalIngresses: []
  enabled: false
initContainers: []
internalTelemetryViaOTLP:
  endpoint: ""
  headers: []
  logs:
    enabled: false
    endpoint: ""
    headers: []
  metrics:
    enabled: false
    endpoint: ""
    headers: []
  traces:
    enabled: false
    endpoint: ""
    headers: []
lifecycleHooks: {}
livenessProbe:
  httpGet:
    path: /
    port: 13133
mode: deployment
nameOverride: ""
namespaceOverride: ""
networkPolicy:
  allowIngressFrom: []
  annotations: {}
  egressRules: []
  enabled: false
  extraIngressRules: []
nodeSelector: {}
podAnnotations: {}
podDisruptionBudget:
  enabled: false
podLabels: {}
podMonitor:
  enabled: false
  extraLabels: {}
  metricsEndpoints:
    - port: metrics
podSecurityContext: {}
ports:
  jaeger-compact:
    containerPort: 6831
    enabled: true
    hostPort: 6831
    protocol: UDP
    servicePort: 6831
  jaeger-grpc:
    containerPort: 14250
    enabled: true
    hostPort: 14250
    protocol: TCP
    servicePort: 14250
  jaeger-thrift:
    containerPort: 14268
    enabled: true
    hostPort: 14268
    protocol: TCP
    servicePort: 14268
  metrics:
    containerPort: 8888
    enabled: false
    protocol: TCP
    servicePort: 8888
  otlp:
    appProtocol: grpc
    containerPort: 4317
    enabled: true
    hostPort: 4317
    protocol: TCP
    servicePort: 4317
  otlp-http:
    containerPort: 4318
    enabled: true
    hostPort: 4318
    protocol: TCP
    servicePort: 4318
  zipkin:
    containerPort: 9411
    enabled: true
    hostPort: 9411
    protocol: TCP
    servicePort: 9411
presets:
  annotationDiscovery:
    logs:
      enabled: false
    metrics:
      enabled: false
  clusterMetrics:
    enabled: false
  hostMetrics:
    enabled: false
  kubeletMetrics:
    enabled: false
  kubernetesAttributes:
    enabled: false
    extractAllPodAnnotations: false
    extractAllPodLabels: false
  kubernetesEvents:
    enabled: false
  logsCollection:
    enabled: false
    includeCollectorLogs: false
    maxRecombineLogSize: 102400
    storeCheckpoints: false
  profiling:
    enabled: false
priorityClassName: ""
prometheusRule:
  defaultRules:
    additionalRuleAnnotations: {}
    additionalRuleLabels: {}
    enabled: false
  enabled: false
  extraLabels: {}
  groups: []
readinessProbe:
  httpGet:
    path: /
    port: 13133
replicaCount: 1
resources: {}
revisionHistoryLimit: 10
rollout:
  rollingUpdate: {}
  strategy: RollingUpdate
runtimeClassName: ""
schedulerName: ""
securityContext: {}
service:
  annotations: {}
  type: ClusterIP
serviceAccount:
  annotations: {}
  automountServiceAccountToken: true
  create: true
  name: ""
serviceMonitor:
  enabled: false
  extraLabels: {}
  metricRelabelings: []
  metricsEndpoints:
    - port: metrics
  relabelings: []
shareProcessNamespace: false
startupProbe: {}
statefulset:
  persistentVolumeClaimRetentionPolicy:
    enabled: false
    whenDeleted: Retain
    whenScaled: Retain
  podManagementPolicy: Parallel
  volumeClaimTemplates: []
terminationGracePeriodSeconds: 30
tolerations: []
topologySpreadConstraints: []
useGOMEMLIMIT: true
