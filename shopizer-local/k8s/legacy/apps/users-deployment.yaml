apiVersion: apps/v1
kind: Deployment
metadata:
  name: users
spec:
  replicas: 1
  selector:
    matchLabels:
      app: users
  template:
    metadata:
      labels:
        app: users
    spec:
      initContainers:
        - name: download-otel-agent
          image: curlimages/curl:latest
          command:
            - sh
            - -c
            - |
              curl -L -o /otel/opentelemetry-javaagent.jar \
              https://github.com/open-telemetry/opentelemetry-java-instrumentation/releases/download/v2.14.0/opentelemetry-javaagent.jar
          volumeMounts:
            - name: otel-agent
              mountPath: /otel
      containers:
        - name: users
          image: localhost:5001/shopizer-users:latest
          resources:
            requests:
              memory: 1Gi
              cpu: 250m
            limits:
              memory: 2Gi
              cpu: 1000m
          volumeMounts:
            - name: otel-agent
              mountPath: /otel
          envFrom:
            - configMapRef:
                name: otel-common-env
          ports:
            - containerPort: 8080
            - containerPort: 5007
          env:
            - name: APPLICATION_DB_HOST
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: APPLICATION_DB_HOST
            - name: APPLICATION_DB_NAME
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: APPLICATION_DB_NAME
            - name: APPLICATION_DB_USER
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: APPLICATION_DB_USER
            - name: APPLICATION_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: APPLICATION_DB_PASSWORD
            - name: APPLICATION_ISSUER_URL
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: APPLICATION_ISSUER_URL
            - name: APPLICATION_SERVICE_ISSUER_URL
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: APPLICATION_SERVICE_ISSUER_URL
            - name: APPLICATION_SERVICE_ISSUER_REALM
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: APPLICATION_SERVICE_ISSUER_REALM
            - name: APPLICATION_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: APPLICATION_CLIENT_ID
            - name: APPLICATION_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: APPLICATION_CLIENT_SECRET
            - name: APPLICATION_CRYPTO_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: APPLICATION_CRYPTO_KEY
            - name: MERCHANT_URL
              value: http://merchants
              #url to call from backend services
            - name: OTEL_SERVICE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['app']
            - name: AUTH_URL
              value: http://keycloak.default.svc.cluster.local/keycloak
            - name: JAVA_TOOL_OPTIONS
              value: >
                -XX:+UseContainerSupport
                -Xmx768m
                -XX:MaxRAMPercentage=45.0
                -XX:MaxMetaspaceSize=256m
                -Xss512k
                -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5007
                -javaagent:/otel/opentelemetry-javaagent.jar
      volumes:
        - name: otel-agent
          emptyDir: {}

